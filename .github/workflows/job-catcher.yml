name: Job Catcher

# Runs automatically every 5 minutes (GitHub's documented minimum
# interval for scheduled workflows — anything shorter isn't
# supported), and can also be triggered manually from the Actions
# tab on GitHub (workflow_dispatch) if you want to test it right
# away.
#
# Three important notes:
#  1. GitHub automatically disables scheduled workflows on public
#     repos after 60 days with no activity (a commit) on the repo.
#     If the script suddenly stops running, open the Actions tab and
#     trigger it manually once, or make a small commit.
#  2. GitHub Actions cron timing isn't exact — it can drift, and
#     GitHub's own docs are explicit that frequent schedules like
#     this one are the most likely to be delayed or occasionally
#     skipped during periods of high platform load. At a 5-minute
#     interval, don't be surprised by an actual cadence closer to
#     every 5-15 minutes in practice — that's GitHub, not a bug here.
#  3. `concurrency` below makes a new scheduled run WAIT for a
#     still-running previous one instead of starting in parallel.
#     Without this, a run that takes longer than 5 minutes (AI calls,
#     retries, the per-message send throttle) could overlap with the
#     next trigger — two runs racing on the same channel cursor and
#     dedup checks could both pass the "already sent?" check for the
#     same message before either finishes writing it, and send a
#     duplicate. This is the fix for that, not a performance nicety.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: job-catcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run job catcher
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
          CLEANUP_INTERVAL_DAYS: ${{ vars.CLEANUP_INTERVAL_DAYS }}
        run: npm start
